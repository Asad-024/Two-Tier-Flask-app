<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager — Two-Tier Flask + MySQL</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 560px;
            margin: 60px auto;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        h1 { font-size: 1.5rem; }
        .subtitle { color: #6e6e73; margin-top: -12px; margin-bottom: 24px; font-size: 0.9rem; }
        form { display: flex; gap: 8px; margin-bottom: 24px; }
        input[type=text] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #0071e3;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #0077ed; }
        ul { list-style: none; padding: 0; }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        li.done span.title { text-decoration: line-through; color: #999; }
        .actions a {
            margin-left: 12px;
            font-size: 0.85rem;
            text-decoration: none;
            color: #0071e3;
        }
        .actions a.delete { color: #d70015; }
        .empty { color: #6e6e73; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1>📋 Task Manager</h1>
    <p class="subtitle">Two-tier app — Flask container + MySQL container</p>

    <form action="/add" method="post">
        <input type="text" name="title" placeholder="What needs doing?" required autofocus>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li class="{{ 'done' if task.done else '' }}">
            <span class="title">{{ task.title }}</span>
            <span class="actions">
                {% if not task.done %}
                <a href="/complete/{{ task.id }}">Complete</a>
                {% endif %}
                <a class="delete" href="/delete/{{ task.id }}">Delete</a>
            </span>
        </li>
        {% else %}
        <li class="empty">No tasks yet — add one above.</li>
        {% endfor %}
    </ul>
</body>
</html>
